version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL?}  # Must be set via environment — TiDB connection string
      JWT_SECRET: ${JWT_SECRET?}  # Must be set via environment — no fallback
      JWT_EXPIRY: 24h
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: http://localhost:3001
    volumes:
      - ./backend/keys:/app/keys